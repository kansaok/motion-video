name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Tes audio (vo, mix, bed) membuat sumber sintetis dengan ffmpeg; jangan bergantung pada
      # isi image runner yang bisa berubah tanpa pemberitahuan.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # Tes Chromium (tata letak, render parsial/varian, render asap 60 frame tiap templat P6-05) dilewati
      # tanpa browser. Satu versi Node cukup. Runner Ubuntu 24.04 membatasi user namespace tanpa hak
      # lewat AppArmor, padahal render memakai sandbox Chromium (OPSI_CHROMIUM); dibuka hanya di runner CI.
      - if: matrix.node == 20
        run: |
          npx playwright install --with-deps chromium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm test
      - run: npm run periksa:playwright
      - run: npm run periksa:tipe
      # Konfigurasi proyek ikut dapat sintaks dicek supaya galat baru tidak lolos ke render.
      - run: find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - if: matrix.node == 20
        run: docker build --tag motion-engine:ci .

  audit:
    name: Audit dependensi (informasi)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
